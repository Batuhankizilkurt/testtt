<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Özge'nin Günleri</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Özge 🌼">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fff1f7">
<style>
:root{--bg:#fff1f7;--card:#ffffff;--tx:#4a1d3a;--mut:#a0728b;--ac:#ec4899;--bad:#e11d48;--ok:#059669}
@media(prefers-color-scheme:dark){:root{--bg:#2a1626;--card:#3b2036;--tx:#fde7f3;--mut:#d7a5c0;--ac:#f472b6;--bad:#fb7185;--ok:#34d399}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom) + 32px)}
.hero{position:relative;text-align:center;padding:calc(env(safe-area-inset-top) + 18px) 8px 18px;margin:0 -16px 14px;overflow:hidden;background:linear-gradient(180deg,#fbcfe8 0%,transparent 100%)}
@media(prefers-color-scheme:dark){.hero{background:linear-gradient(180deg,#5b2a4f 0%,transparent 100%)}}
.d{display:block}
.big{width:130px;height:130px;margin:0 auto;transform-origin:50% 50%;animation:sway 6s ease-in-out infinite alternate;filter:drop-shadow(0 6px 10px #ec489944)}
.s{position:absolute;opacity:.9;animation:float 7s ease-in-out infinite alternate}
.s1{width:46px;height:46px;left:7%;top:calc(env(safe-area-inset-top) + 26px)}
.s2{width:34px;height:34px;right:9%;top:calc(env(safe-area-inset-top) + 18px);animation-delay:-2s}
.s3{width:26px;height:26px;right:20%;top:calc(env(safe-area-inset-top) + 100px);animation-delay:-4s}
.s4{width:30px;height:30px;left:19%;top:calc(env(safe-area-inset-top) + 104px);animation-delay:-1s}
@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes float{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(10px) rotate(14deg)}}
@media(prefers-reduced-motion:reduce){.big,.s{animation:none}}
.hello{margin:10px 0 0;font-size:14px;color:var(--mut)}
h1{font-size:28px;margin:2px 0 6px}
.sweet{margin:0 auto;max-width:320px;font-size:15px;color:var(--mut);line-height:1.4;font-style:italic}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 4px 14px #ec489914}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #ec489944;background:transparent;color:inherit;font:inherit}
button{font:inherit;border:0;border-radius:14px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:600;width:100%;margin-top:12px}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.sm{width:auto;margin:0;padding:6px 10px;background:transparent;color:var(--bad);font-weight:500}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #ec489922}
.item:first-child{border-top:0}.item .t{flex:1;min-width:0}.item b{display:block;overflow-wrap:anywhere}
.item small{color:var(--mut)}.badge{font-size:13px;font-weight:700;color:var(--ac);white-space:nowrap}
.done{opacity:.5}.hint{font-size:14px;color:var(--mut);line-height:1.45}.msg{font-size:14px;margin-top:8px}
.hidden{display:none}
.today{text-align:center}.dayname{font-size:46px;font-weight:800;color:var(--ac);margin:2px 0}
.week{display:flex;gap:6px;margin-top:14px}.week span{flex:1;padding:8px 0;border-radius:10px;font-size:12px;color:var(--mut);background:#ec489910}
.week span.on{background:var(--ac);color:#fff;font-weight:700}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="daisy">
  <g fill="#fff" stroke="#f5c0da" stroke-width="1.2"><ellipse cx="0" cy="-34" rx="9" ry="20" transform="rotate(0)"/><ellipse cx="0" cy="-34" rx="9" ry="20" transform="rotate(30)"/><ellipse cx="0" cy="-34" rx="9" ry="20" transform="rotate(60)"/><ellipse cx="0" cy="-34" rx="9" ry="20" transform="rotate(90)"/><ellipse cx="0" cy="-34" rx="9" ry="20" transform="rotate(120)"/><ellipse cx="0" cy="-34" rx="9" ry="20" transform="rotate(150)"/><ellipse cx="0" cy="-34" rx="9" ry="20" transform="rotate(180)"/><ellipse cx="0" cy="-34" rx="9" ry="20" transform="rotate(210)"/><ellipse cx="0" cy="-34" rx="9" ry="20" transform="rotate(240)"/><ellipse cx="0" cy="-34" rx="9" ry="20" transform="rotate(270)"/><ellipse cx="0" cy="-34" rx="9" ry="20" transform="rotate(300)"/><ellipse cx="0" cy="-34" rx="9" ry="20" transform="rotate(330)"/></g>
  <circle r="16" fill="#fbbf24" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="-4" cy="-4" r="4" fill="#fde68a"/>
</g></defs></svg>

<main>
  <header class="hero">
    <svg class="d s s1" viewBox="-60 -60 120 120"><use href="#daisy"/></svg>
    <svg class="d s s2" viewBox="-60 -60 120 120"><use href="#daisy"/></svg>
    <svg class="d s s3" viewBox="-60 -60 120 120"><use href="#daisy"/></svg>
    <svg class="d s s4" viewBox="-60 -60 120 120"><use href="#daisy"/></svg>
    <svg class="d big" viewBox="-60 -60 120 120"><use href="#daisy"/></svg>
    <p class="hello" id="hello"></p>
    <h1>Hoş geldin Özge 🌼</h1>
    <p class="sweet" id="sweet"></p>
  </header>

  <div class="card today">
    <div class="hint">Bugün günlerden</div>
    <div class="dayname" id="day">…</div>
    <div class="hint" id="date"></div>
    <div class="week" id="week"></div>
  </div>

  <div class="card" id="install">
    <b>Ana ekrana ekle</b>
    <p class="hint">iPhone'da bildirim için Safari'de <b>Paylaş → Ana Ekrana Ekle</b> yap, sonra uygulamayı ana ekrandaki simgeden aç.</p>
  </div>

  <div class="card hidden" id="notif">
    <b>Saat başı hatırlatma</b>
    <p class="hint" id="notifState">Kapalı</p>
    <button id="enable">Bildirimleri aç</button>
    <div id="settings" class="hidden">
      <label for="start">Başlangıç saati</label><select id="start"></select>
      <label for="end">Bitiş saati</label><select id="end"></select>
      <label for="every">Sıklık</label><select id="every"></select>
      <button id="test" class="ghost">Test bildirimi gönder</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
